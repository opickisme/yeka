<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Katalog Sepatu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap admin">

    <section id="login" class="panel narrow">
      <h1>Admin</h1>
      <form id="loginForm">
        <label for="pwd">Password</label>
        <input class="ctl" id="pwd" type="password" required autocomplete="current-password">
        <p class="hint" id="loginErr"></p>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <p class="note">Password awal: admin123. Ganti setelah masuk.</p>
    </section>

    <div id="panel" hidden>
      <div class="bar">
        <h1>Kelola katalog</h1>
        <div class="links">
          <a href="index.html" target="_blank">Lihat katalog</a>
          <button class="btn ghost" id="logout" type="button">Keluar</button>
        </div>
      </div>

      <section class="panel">
        <h2>Pengaturan toko</h2>
        <form id="cfgForm" class="form">
          <label>Nama toko
            <input class="ctl" id="cStore" required>
          </label>
          <label>Nomor WhatsApp admin
            <input class="ctl" id="cWa" inputmode="tel" required placeholder="08123456789">
            <small>Boleh diawali 0 atau 62.</small>
          </label>
          <label class="full">Password baru
            <input class="ctl" id="cPwd" type="password" autocomplete="new-password" placeholder="Kosongkan bila tidak diganti">
          </label>
          <div class="row full">
            <button class="btn" type="submit">Simpan pengaturan</button>
            <span class="note" id="cMsg" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2 id="formTitle">Tambah produk</h2>
        <form id="pForm" class="form">
          <input type="hidden" id="pId">
          <label>Nama produk
            <input class="ctl" id="pName" required>
          </label>
          <label>Merk
            <input class="ctl" id="pBrand" required>
          </label>
          <label>Size
            <input class="ctl" id="pSizes" required placeholder="39, 40, 41, 42">
            <small>Pisahkan dengan koma.</small>
          </label>
          <label>Harga (Rp)
            <input class="ctl" id="pPrice" type="number" min="0" step="1000" required>
          </label>
          <label>Nama warna
            <input class="ctl" id="pColor" required placeholder="Hitam">
          </label>
          <label>Pilih warna
            <input class="ctl" id="pHex" type="color" value="#1c1c1c">
          </label>
          <label class="full">URL foto (opsional)
            <input class="ctl" id="pImg" type="url" placeholder="https://...">
            <small>Kosongkan untuk memakai ilustrasi sepatu sesuai warna.</small>
          </label>
          <div class="row full">
            <button class="btn" type="submit" id="pSave">Simpan produk</button>
            <button class="btn ghost" type="button" id="pCancel" hidden>Batal edit</button>
            <span class="note" id="pMsg" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Daftar produk</h2>
        <ul id="list"></ul>
      </section>

      <section class="panel">
        <h2>Cadangan data</h2>
        <div class="row">
          <button class="btn ghost" id="exp" type="button">Unduh data (JSON)</button>
          <label class="btn ghost" for="imp">Impor data</label>
          <input id="imp" type="file" accept="application/json" hidden>
          <span class="note" id="bMsg" aria-live="polite"></span>
        </div>
      </section>
    </div>

  </main>

  <script src="shared.js"></script>
  <script src="admin.js"></script>
</body>
</html>
