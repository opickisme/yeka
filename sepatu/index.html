<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Sepatu</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="head">
    <div class="wrap">
      <a class="logo" id="logo" href="./">Katalog Sepatu</a>
      <button class="theme" id="theme" type="button" aria-label="Ganti tema terang/gelap">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="slider" id="slider" aria-label="Produk terbaru" hidden>
      <div class="track" id="track"></div>
      <div class="dots" id="dots"></div>
    </section>

    <form class="filters" id="filters" aria-label="Filter produk">
      <input class="ctl" id="q" type="search" placeholder="Cari nama atau merk" aria-label="Cari">
      <select class="ctl" id="fBrand" aria-label="Merk"></select>
      <select class="ctl" id="fSize" aria-label="Size"></select>
      <select class="ctl" id="fColor" aria-label="Warna"></select>
      <button class="btn ghost" type="reset">Reset</button>
    </form>
    <p id="count" aria-live="polite"></p>
    <section class="grid" id="grid"><p class="empty">Memuat produk...</p></section>
  </main>

  <footer class="wrap"><a href="admin.html">Admin</a></footer>

  <script src="shared.js"></script>
  <script src="user.js"></script>
</body>
</html>
